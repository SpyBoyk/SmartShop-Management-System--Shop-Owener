version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartshop123}
      POSTGRES_DB: ${POSTGRES_DB:-smartshop_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartshop} -d ${POSTGRES_DB:-smartshop_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartshop-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartshop}:${POSTGRES_PASSWORD:-smartshop123}@postgres:5432/${POSTGRES_DB:-smartshop_db}
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:

